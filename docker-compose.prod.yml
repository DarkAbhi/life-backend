services:
  web:
    build: .
    restart: always
    command: gunicorn life.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/code
      - static_volume:/code/staticfiles
      - media_volume:/code/mediafiles
    env_file:
      - ./.env
    expose:
      - 8000
  telegram-bot:
    build:
      context: ./telegram-bot
    env_file:
      - ./.env
    restart: always
    depends_on:
      - web
  nginx:
    build: ./nginx
    restart: always
    ports:
      - ${NGINX_PORT}:80
    volumes:
      - static_volume:/code/staticfiles
      - media_volume:/code/mediafiles
    depends_on:
      - web

volumes:
  static_volume:
  media_volume:
